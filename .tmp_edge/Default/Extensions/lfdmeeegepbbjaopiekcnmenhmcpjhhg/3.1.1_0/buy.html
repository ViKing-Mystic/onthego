<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
    <title>Online PDF Converter</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="main-box">
        <div class="content">
            <div id="file-count" class="file-count">
                <a href="./index.html">
                    <img src="./images/left.svg" alt="">
                </a>
                <a href="./files.html">
                    <span class="hide">1</span>
                    <img src="./images/lb.svg" alt="">
                </a>
            </div>
            <div class="loginbtn">
                <a href="https://qwerpdf.com/user/signin" target="_blank">
                    <img src="./images/people.png">  
                    <span>__MSG_page_login__</span>
                </a>
            </div>
            <div class="userface hide">
                <img src="images/icon.png" />
            </div>
            <div class="logo">
                <a href="./index.html">
                    <img src="images/logo.png" />
                </a>
            </div>
            <div class="logo-title">
                <div class="logo-title-text">__MSG_logo_title_text__</div>
            </div>
            <div class="line"></div>
            <div class="buy-box">
                <a href="https://qwerpdf.com/pricing.html" target="_blank"><img src="images/buy.png"></a>
            </div>
        </div>
        <script type="text/javascript" src="./js/localize.js"></script>
        <script type="text/javascript" src="./js/misc.js"></script>
        <script type="text/javascript" src="./js/config.js"></script>
        <script type="text/javascript" src="./js/buy.js"></script>
    </div>
</body>

</html>
