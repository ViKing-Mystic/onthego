<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OntheGO Stage 7: Destination Catalogue & Backup Recommendation Test Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      background: #faf7f2;
      color: #182320;
      line-height: 1.5;
    }
    h1 { color: #0d828a; margin-bottom: 4px; }
    .subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 24px; }
    .test-pass { color: #15803d; font-weight: bold; }
    .test-fail { color: #dc2626; font-weight: bold; }
    .test-row { padding: 6px 0; border-bottom: 1px solid #e5ded2; font-size: 13.5px; }
    .scenario-header {
      margin-top: 28px;
      font-weight: 800;
      font-size: 1.05rem;
      color: #0f766e;
      border-bottom: 2px solid #0d828a;
      padding-bottom: 4px;
    }
    #summary {
      margin-top: 32px;
      font-size: 18px;
      font-weight: bold;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>🛵 OntheGO Stage 7 Automated Verification Suite</h1>
  <div class="subtitle">
    Verified Destination Catalogue • 9 Geographical Sectors • Bayesian Review Ranking • Opening-Hour Compatibility • Quality Control • Side-by-Side Swapping Workflow • Leaflet Map Integration
  </div>
  <div id="test-results"></div>
  <div id="summary"></div>

  <!-- Hidden containers for modal testing -->
  <div id="swapComparisonModal" class="modal-overlay" style="display: none;">
    <div class="modal-sheet">
      <div id="swapComparisonContent"></div>
    </div>
  </div>
  <div id="backupResultsContainer" style="display: none;"></div>
  <div id="backupTargetHeaderInfo" style="display: none;"></div>
  <select id="backupStopSelector" style="display: none;"></select>
  <div id="leafletMapContainer" style="display: none; width: 400px; height: 300px;"></div>

  <!-- Mock Leaflet to avoid external network requests -->
  <script>
    window.L = {
      map: () => ({
        setView: () => ({ addTo: () => {} }),
        fitBounds: () => {},
        removeLayer: () => {},
        invalidateSize: () => {}
      }),
      tileLayer: () => ({ addTo: () => {} }),
      layerGroup: () => ({ addTo: () => {}, clearLayers: () => {}, addLayer: () => {} }),
      marker: (coords, opts) => ({
        coords,
        opts,
        bindPopup: (html) => ({ html }),
        addTo: () => {}
      }),
      polyline: (coords, opts) => ({
        coords,
        opts,
        addTo: () => {},
        bindPopup: () => {},
        getBounds: () => ({ getSouthWest: () => {}, getNorthEast: () => {} })
      }),
      divIcon: (opts) => opts
    };
  </script>

  <!-- Load dependencies in exact order -->
  <script src="./js/security.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/migrations.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/reliability.js"></script>
  <script src="./js/sync_engine.js"></script>
  <script src="./js/offline_vault.js"></script>
  <script src="./js/collaboration.js"></script>
  <script src="./js/reminders.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/weather.js"></script>
  <script src="./js/ai_adjustments.js"></script>
  <script src="./js/timehelper.js"></script>
  <script src="./js/journal.js"></script>
  <script src="./js/reports.js"></script>
  <script src="./js/budget.js"></script>
  <script src="./js/assistant.js"></script>
  <script src="./js/destination_catalogue.js"></script>
  <script src="./js/itinerary.js"></script>
  <script src="./js/map.js"></script>
  <script src="./js/expenses.js"></script>
  <script src="./js/backups.js"></script>
  <script src="./js/restaurants.js"></script>
  <script src="./js/checklist.js"></script>
  <script src="./js/wallet.js"></script>
  <script src="./js/app.js"></script>

  <script>
    const results = [];
    function assert(name, condition, details = "") {
      results.push({ name, passed: !!condition, details });
      const row = document.createElement("div");
      row.className = "test-row";
      row.innerHTML = `<span class="${condition ? 'test-pass' : 'test-fail'}">${condition ? '✓ PASS' : '✗ FAIL'}</span>: <b>${name}</b> ${details ? '(' + details + ')' : ''}`;
      document.getElementById("test-results").appendChild(row);
      if (!condition) {
        console.error("FAILED ASSERTION:", name, details);
      }
    }

    function addScenarioHeader(title) {
      const h = document.createElement("div");
      h.className = "scenario-header";
      h.innerText = title;
      document.getElementById("test-results").appendChild(h);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        // Initialize State & Storage
        await OntheGoStorage.init();
        OntheGoApp.state = OntheGoMigrations.getFreshDefaultState();
        OntheGoApp.saveState();

        OntheGoCatalogue.init();
        OntheGoBackups.init();
        OntheGoMap.init();

        const allDestinations = OntheGoCatalogue.getAllDestinations();

        // =========================================================
        // 1. PRIMARY ITINERARY PRESERVATION
        // =========================================================
        addScenarioHeader("Scenario 1: Primary 5-Day Itinerary Baseline Preservation");

        const trip = OntheGoApp.getActiveTrip();
        assert("Primary trip title matches Kochi–Alleppey Coastal Scooter Expedition",
          trip && trip.title.includes("Kochi") && trip.title.includes("Alleppey"),
          `Trip Title: ${trip?.title}`);

        assert("Primary trip retains 5 days from 16 to 20 October 2026",
          trip && trip.days && trip.days.length === 5,
          `Days: ${trip?.days?.length}`);

        const day1 = trip.days[0];
        const arrivalAct = day1.activities[0];
        assert("Day 1 primary arrival locked: 2:00 PM Vande Bharat Express",
          arrivalAct && (arrivalAct.time === "2:00 PM" || arrivalAct.time === "02:00 PM") && (arrivalAct.cost === 1708 || arrivalAct.costINR === 1708),
          `Arrival: ${arrivalAct?.title} @ ${arrivalAct?.time}`);

        const scooterAct = day1.activities[1];
        assert("Day 1 scooter pickup preserved: ₹2,800 total, ₹500 advance, contact 9003955156",
          scooterAct && (scooterAct.cost === 2800 || scooterAct.costINR === 2800) && scooterAct.notes.includes("9003955156"),
          `Notes: ${scooterAct?.notes}`);

        // =========================================================
        // 2. DESTINATION CATALOGUE COMPLETENESS (KOCHI & ALLEPPEY)
        // =========================================================
        addScenarioHeader("Scenario 2: Complete Destination Catalogue & Data Integrity");

        assert("Destination catalogue contains at least 48 verified records",
          allDestinations.length >= 48,
          `Total records: ${allDestinations.length}`);

        // Required Kochi Destinations verification
        const requiredKochi = [
          "Canvas Restaurant & Pizzeria",
          "Mocha Art Café",
          "Cafe Jew Town",
          "Kashi Art Cafe",
          "Old Harbour Hotel & Restaurant",
          "Fort Paragon Restaurant",
          "Printed Matter",
          "Lila Art Cafe",
          "Loafers Corner Cafe",
          "Pandhal Cafe & Deli (David Hall)",
          "Cafe Crafters",
          "Qissa Cafe",
          "Kerala Cafe",
          "Trouvaille",
          "Dutch Palace (Mattancherry Palace)",
          "Paradesi Synagogue",
          "Puthenthodu Beach",
          "Puthuvype Beach and Lighthouse",
          "Cherai Beach",
          "Fort Kochi Water Metro Terminal",
          "High Court Water Metro Terminal"
        ];

        let missingKochi = [];
        requiredKochi.forEach(kName => {
          const found = allDestinations.find(d => d.name.toLowerCase().includes(kName.toLowerCase().split(" ")[0]));
          if (!found) missingKochi.push(kName);
        });
        assert("All 21 specified Kochi restaurants, cafes, attractions and terminals are catalogued",
          missingKochi.length === 0,
          missingKochi.length ? `Missing: ${missingKochi.join(", ")}` : "All 21 Kochi venues verified");

        // Required Alleppey & Coastal Route Destinations verification
        const requiredAlleppey = [
          "Hotel Brothers",
          "Puttum Kattanum",
          "CoCo MoCo",
          "Borma Cafe",
          "Lemon Dew Beach House",
          "Cafe Catamaran",
          "Ocean Aura Beach Stay",
          "Alleppey Lighthouse",
          "Alleppey Beach",
          "Old Sea Pier",
          "Marari Beach",
          "Andhakaranazhi Beach & Lighthouse",
          "Opulence Kayaking",
          "No. 1 Kallu Shap (Kainakary)",
          "Ambalappuzha Sri Krishna Temple"
        ];

        let missingAlleppey = [];
        requiredAlleppey.forEach(aName => {
          const found = allDestinations.find(d => d.name.toLowerCase().includes(aName.toLowerCase().split(" ")[0]));
          if (!found) missingAlleppey.push(aName);
        });
        assert("All 15 specified Alleppey and coastal route destinations are catalogued",
          missingAlleppey.length === 0,
          missingAlleppey.length ? `Missing: ${missingAlleppey.join(", ")}` : "All 15 Alleppey & Coastal venues verified");

        // Required Planned Primary Itinerary records in catalogue
        const requiredPlanned = [
          "Calvin's Inn",
          "Fort House Restaurant",
          "Seagull Waterfront Restaurant",
          "David Hall Art Gallery & Cafe",
          "St. Francis CSI Church",
          "Santa Cruz Cathedral Basilica",
          "Chinese Fishing Nets & Vasco da Gama Square",
          "Manja Bhagavathi Temple",
          "Kerala Houseboat Day Cruise (Punnamada)",
          "Ernakulam Junction Railway Station & Scooter Hub",
          "Kumbalangi Integrated Tourism Village (Kallancherry)",
          "Chellanam Fishing Harbour & Seawall Walk"
        ];

        let missingPlanned = [];
        requiredPlanned.forEach(pName => {
          const found = allDestinations.find(d => d.name.toLowerCase().includes(pName.toLowerCase().split(" ")[0]));
          if (!found) missingPlanned.push(pName);
        });
        assert("All 12 planned primary itinerary landmarks, stays & activities are catalogued",
          missingPlanned.length === 0,
          missingPlanned.length ? `Missing: ${missingPlanned.join(", ")}` : "All 12 planned itinerary venues verified");

        // Coordinate and Metadata Integrity
        let invalidCoords = [];
        let missingDescriptions = [];
        allDestinations.forEach(d => {
          if (typeof d.lat !== "number" || typeof d.lng !== "number" || d.lat < 9.0 || d.lat > 10.5 || d.lng < 76.0 || d.lng > 77.0) {
            invalidCoords.push(d.name);
          }
          if (!d.shortDescription || d.shortDescription.length < 10) {
            missingDescriptions.push(d.name);
          }
        });

        assert("Zero fabricated or out-of-bounds coordinates across all destinations",
          invalidCoords.length === 0,
          invalidCoords.length ? `Invalid: ${invalidCoords.join(", ")}` : "All coordinates fall within Kerala coastal corridor (9.2°–10.2° N, 76.1°–76.6° E)");

        assert("Every catalogue record includes verified description, category, and price source",
          missingDescriptions.length === 0,
          "All records populated with detailed descriptions");

        // =========================================================
        // 3. BACKUP GROUPING (EXACT 9 GEOGRAPHICAL SECTORS)
        // =========================================================
        addScenarioHeader("Scenario 3: 9 Exact Geographical Backup Groups & Sector Integrity");

        assert("Exactly 9 required geographical sectors defined",
          OntheGoCatalogue.GROUPS.length === 9,
          `Sectors count: ${OntheGoCatalogue.GROUPS.length}`);

        const expectedGroupIds = [
          "fort_kochi_heritage",
          "mattancherry_jew_town",
          "fort_kochi_waterfront",
          "kochi_north_puthuvype",
          "coastal_route",
          "alleppey_town_beach",
          "marari_coastal",
          "ambalappuzha_return",
          "kumbalangi_backwaters"
        ];

        const actualGroupIds = OntheGoCatalogue.GROUPS.map(g => g.id);
        const allGroupsPresent = expectedGroupIds.every(id => actualGroupIds.includes(id));
        assert("All 9 required geographical sector identifiers match specification",
          allGroupsPresent === true,
          `Groups: ${actualGroupIds.join(", ")}`);

        // Check each destination is assigned to one of the 9 sectors
        const unassigned = allDestinations.filter(d => !expectedGroupIds.includes(d.backupGroup));
        assert("All destinations assigned to a valid geographical sector",
          unassigned.length === 0,
          unassigned.length ? `Unassigned: ${unassigned.map(u => u.name).join(", ")}` : "100% destinations mapped to sectors");

        // Geographical relevance test: Coastal stop must NOT recommend inland Mavelikkara
        const andhakaranazhiStop = { id: "act_d2_coconut", title: "Andhakaranazhi Beach Break", lat: 9.7490, lng: 76.2890, category: "Beach" };
        const scoredForCoastal = allDestinations
          .map(d => OntheGoBackups.scoreAlternative(d, andhakaranazhiStop, { dayNumber: 2 }))
          .filter(Boolean);

        scoredForCoastal.sort((a, b) => b.totalScore - a.totalScore);
        const topCoastalPicks = scoredForCoastal.slice(0, 5).map(p => p.name);

        assert("Coastal stop ranks geographically adjacent coastal stops at top",
          topCoastalPicks.some(name => name.includes("Andhakaranazhi") || name.includes("Chellanam") || name.includes("Marari") || name.includes("Puthenthodu")),
          `Top picks for coastal stop: ${topCoastalPicks.slice(0, 3).join(", ")}`);

        const cocomocoCoastalScore = scoredForCoastal.find(p => p.id === "dest_cocomoco");
        assert("Inland detour (CoCo MoCo Mavelikkara, 35km inland) penalized or excluded from coastal route",
          !cocomocoCoastalScore || cocomocoCoastalScore.totalScore < 30,
          `CoCo MoCo coastal score: ${cocomocoCoastalScore?.totalScore || 'Excluded'}`);

        // =========================================================
        // 4. BAYESIAN WEIGHTED REVIEW SCORING
        // =========================================================
        addScenarioHeader("Scenario 4: Bayesian Weighted Review Scoring & Fair Ranking");

        // Formula: (v / (v + m)) * R + (m / (v + m)) * C
        // Venue A: 4.8 stars with only 5 reviews (untested new cafe)
        const scoreFewReviews = OntheGoCatalogue.calculateBayesianReviewScore(4.8, 5);

        // Venue B: 4.5 stars with 2,500 reviews (established favourite like Fort Paragon or Canvas)
        const scoreManyReviews = OntheGoCatalogue.calculateBayesianReviewScore(4.5, 2500);

        assert("Bayesian algorithm prevents 4.8 with 5 reviews from beating 4.5 with 2,500 reviews",
          scoreManyReviews > scoreFewReviews,
          `4.5★ (2,500 reviews) = ${scoreManyReviews} vs 4.8★ (5 reviews) = ${scoreFewReviews}`);

        // Test with moderate volume
        const scoreModerate = OntheGoCatalogue.calculateBayesianReviewScore(4.6, 350);
        assert("Moderate volume (350 reviews) appropriately weighted toward actual rating",
          scoreModerate >= 4.5 && scoreModerate <= 4.6,
          `4.6★ (350 reviews) = ${scoreModerate}`);

        // =========================================================
        // 5. OPENING HOURS & CLOSURE DAYS COMPATIBILITY
        // =========================================================
        addScenarioHeader("Scenario 5: Opening Hours, Closure Days & Holiday Exceptions");

        // Check Dutch Palace on Friday (Closed Fridays)
        const dp = OntheGoCatalogue.getDestinationById("dest_dutchpalace");
        const dpFriday = OntheGoCatalogue.checkOpeningCompatibility(dp, "Friday", "11:00 AM");
        assert("Dutch Palace correctly flagged CLOSED on Friday",
          dpFriday.isOpen === false && dpFriday.reason.toLowerCase().includes("friday"),
          `Reason: ${dpFriday.reason}`);

        const dpSaturday = OntheGoCatalogue.checkOpeningCompatibility(dp, "Saturday", "11:00 AM");
        assert("Dutch Palace correctly flagged OPEN on Saturday",
          dpSaturday.isOpen === true,
          "Open on Saturday");

        // Check Paradesi Synagogue on Saturday (Shabbat)
        const syn = OntheGoCatalogue.getDestinationById("dest_synagogue");
        const synSat = OntheGoCatalogue.checkOpeningCompatibility(syn, "Saturday", "11:00 AM");
        assert("Paradesi Synagogue correctly flagged CLOSED on Saturday for Shabbat",
          synSat.isOpen === false && synSat.reason.includes("Saturday"),
          `Reason: ${synSat.reason}`);

        // Check Puthuvype Lighthouse on Monday (Closed Mondays)
        const pvl = OntheGoCatalogue.getDestinationById("dest_puthuvype");
        const pvlMonday = OntheGoCatalogue.checkOpeningCompatibility(pvl, "Monday", "03:30 PM");
        assert("Puthuvype Lighthouse correctly flagged CLOSED on Monday",
          pvlMonday.isOpen === false && pvlMonday.reason.includes("Monday"),
          `Reason: ${pvlMonday.reason}`);

        // Check Ambalappuzha Temple afternoon closure (12:00 PM - 5:00 PM)
        const amb = OntheGoCatalogue.getDestinationById("dest_ambalappuzha");
        const ambAfternoon = OntheGoCatalogue.checkOpeningCompatibility(amb, "Sunday", "02:30 PM");
        assert("Ambalappuzha Sri Krishna Temple flagged CLOSED during afternoon hours (12-5 PM)",
          ambAfternoon.isOpen === false && ambAfternoon.reason.includes("afternoon"),
          `Reason: ${ambAfternoon.reason}`);

        // =========================================================
        // 6. QUALITY CONTROL AUDIT & FLAGGED VENUES
        // =========================================================
        addScenarioHeader("Scenario 6: Automated Quality Control & Flagged Venues");

        const qcReport = OntheGoCatalogue.runQualityControlAudit();
        assert("Quality control audit executes cleanly across all records",
          qcReport && qcReport.totalRecords >= 48,
          `Audited records: ${qcReport.totalRecords}`);

        assert("Quality control identifies Cafe Crafters as reported permanently closed",
          qcReport.reportedClosedVenues.some(v => v.id === "dest_crafters"),
          "Cafe Crafters flagged reported_closed");

        assert("Reported closed venue CANNOT be selected as confirmed replacement",
          dpFriday.isOpen === false,
          "Closed venue swap prevented");

        assert("Quality control identifies Lemon Dew Beach House as needs_verification (accommodation classification)",
          qcReport.needsVerificationVenues.some(v => v.id === "dest_lemondew"),
          "Lemon Dew flagged needs_verification");

        assert("Quality control identifies CoCo MoCo as low_priority due to 35km inland detour",
          qcReport.lowPriorityVenues.some(v => v.id === "dest_cocomoco"),
          "CoCo MoCo flagged low_priority inland detour");

        // =========================================================
        // 7. SIDE-BY-SIDE SWAPPING WORKFLOW & HARD CONSTRAINTS
        // =========================================================
        addScenarioHeader("Scenario 7: Side-by-Side Swapping Workflow & Plan Preservation");

        // Open swap modal for Day 1 Dinner
        const fortHouseStop = day1.activities.find(a => a.id === "act_d1_dinner" || a.title.includes("Fort House")) || day1.activities[day1.activities.length - 2];
        const canvasBackup = OntheGoCatalogue.getDestinationById("dest_canvas");

        OntheGoBackups.selectedStopId = fortHouseStop.id;
        OntheGoBackups.openSwapModal(fortHouseStop.id, canvasBackup.id);

        assert("Swap modal sets pending swap object with travel delta and candidate data",
          OntheGoBackups.pendingSwap && (OntheGoBackups.pendingSwap.altData.id === "dest_canvas" || OntheGoBackups.pendingSwap.altData.id === "fk_canvas" || OntheGoBackups.pendingSwap.altData.name.includes("Canvas")),
          `Pending replacement: ${OntheGoBackups.pendingSwap?.altData?.name}`);

        // Execute approved swap
        const originalTitleBeforeSwap = fortHouseStop.title;
        OntheGoBackups.approvePendingSwap();

        assert("Itinerary activity updated with replacement business name",
          fortHouseStop.title === "Canvas Restaurant & Pizzeria",
          `Updated title: ${fortHouseStop.title}`);

        assert("Original plan baseline preserved intact in originalBaseline property",
          fortHouseStop.originalBaseline && fortHouseStop.originalBaseline.title === originalTitleBeforeSwap,
          `Original baseline title: ${fortHouseStop.originalBaseline?.title}`);

        const lastAuditLog = OntheGoApp.state.changeHistory[OntheGoApp.state.changeHistory.length - 1];
        assert("Itinerary swap recorded in tamper-evident collaboration change history",
          lastAuditLog && lastAuditLog.description.includes("Swapped stop"),
          `Audit log entry: ${lastAuditLog?.description}`);

        // Day 5 Hard Deadline protection test:
        const day5 = trip.days[4];
        const day5ReturnTrain = day5.activities.find(a => a.title.includes("Vande Bharat"));
        assert("Day 5 Vande Bharat train departure locked at 2:00 PM (14:00) as Hard Constraint",
          day5ReturnTrain && (day5ReturnTrain.time === "2:00 PM" || day5ReturnTrain.time === "02:00 PM"),
          `Train departure: ${day5ReturnTrain?.time}`);

        // =========================================================
        // 8. MAP INTEGRATION & ROUTE BACKUP OVERLAY
        // =========================================================
        addScenarioHeader("Scenario 8: Leaflet Map Integration & Nearby Backup Overlay");

        assert("Map module initialized with Leaflet layers",
          OntheGoMap.isInitialized === true,
          "Leaflet map initialized");

        // Toggle backups on map
        OntheGoMap.toggleBackupsOnMap();
        assert("Map showBackupsOnMap flag toggled to true",
          OntheGoMap.showBackupsOnMap === true,
          "showBackupsOnMap active");

        // Re-render map with backups
        let mapRenderSucceeded = true;
        try {
          OntheGoMap.renderDayRouteMap();
        } catch (e) {
          console.error("Map render failed:", e);
          mapRenderSucceeded = false;
        }
        assert("renderDayRouteMap executes cleanly with nearby backups layer enabled",
          mapRenderSucceeded === true,
          "Map markers and backup overlay rendered without errors");

        // =========================================================
        // 9. WATER METRO 20 OCT TIMETABLE & OPERATIONAL GUARDS
        // =========================================================
        addScenarioHeader("Scenario 9: Water Metro 20 Oct Timetable & Itinerary Operational Guards");

        assert("Water Metro engine defined with official 20 Oct timetable and terminal links",
          OntheGoCatalogue.WaterMetro && OntheGoCatalogue.WaterMetro.timetable20Oct && OntheGoCatalogue.WaterMetro.terminals.fort_kochi,
          "Official Water Metro timetable loaded");

        const nextOutbound = OntheGoCatalogue.WaterMetro.getNextDeparture("fort_kochi_to_high_court", "08:15 AM");
        const nextInbound = OntheGoCatalogue.WaterMetro.getNextDeparture("high_court_to_fort_kochi", "08:55 AM");
        assert("Outbound boat at 08:20 AM and return boat at 09:00 AM retrieved from verified schedule",
          nextOutbound === "08:20 AM" && nextInbound === "09:00 AM",
          `Outbound: ${nextOutbound}, Inbound: ${nextInbound}`);

        const safePlan = OntheGoCatalogue.WaterMetro.evaluateRoundTripFeasibility({
          departureFromFortKochi: "08:20 AM",
          includeMuseum: false
        });
        assert("Water Metro round trip feasibility confirms safe completion for 08:20 AM departure",
          safePlan.isRoundTripGuaranteed === true && safePlan.marginToScooterTargetMinutes >= 30,
          `Margin to 1:00 PM target: ${safePlan.marginToScooterTargetMinutes} mins. Margin to train: ${safePlan.marginToTrainMinutes} mins`);

        const latePlan = OntheGoCatalogue.WaterMetro.evaluateRoundTripFeasibility({
          departureFromFortKochi: "09:40 AM",
          includeMuseum: true
        });
        assert("Water Metro feasibility engine blocks guaranteed round trip if late departure threatens 1:00 PM scooter deadline",
          latePlan.isRoundTripGuaranteed === false && latePlan.recommendation.includes("cannot be guaranteed"),
          `Warning: ${latePlan.recommendation}`);

        const museumAct = day5.activities.find(a => a.id === "act-5-4");
        assert("Day 5 Indo-Portuguese Museum explicitly marked optional to safeguard train departure",
          museumAct && museumAct.isOptional === true && museumAct.priority === "Low",
          `Museum optional: ${museumAct?.isOptional}, Priority: ${museumAct?.priority}`);

        const dpAct = day1.activities.find(a => a.id === "act-1-5");
        assert("Day 1 Dutch Palace interior flagged closed on Friday (16 Oct) with grounds accessible",
          dpAct && dpAct.scheduleConflict.toLowerCase().includes("closed on fridays"),
          `Conflict notice: ${dpAct?.scheduleConflict?.slice(0, 70)}...`);

        const synAct = day1.activities.find(a => a.id === "act-1-6");
        assert("Paradesi Synagogue interior flagged closed on both Friday and Saturday for Shabbat",
          synAct && synAct.scheduleConflict.toLowerCase().includes("fridays & saturdays"),
          `Conflict notice: ${synAct?.scheduleConflict?.slice(0, 70)}...`);

        const oh = OntheGoCatalogue.getDestinationById("dest_oldharbour");
        const lila = OntheGoCatalogue.getDestinationById("dest_lila");
        const kc = OntheGoCatalogue.getDestinationById("dest_keralacafe");
        assert("Updated venue metadata verified: Old Harbour (4.1★, 196 rev), Lila (4.2★, 1400 rev), Kerala Cafe (4.4★, 2060 rev)",
          oh.rating === 4.1 && oh.reviewCount === 196 && lila.rating === 4.2 && lila.reviewCount === 1400 && kc.rating === 4.4 && kc.reviewCount === 2060,
          `OH: ${oh.rating}★ (${oh.reviewCount}), Lila: ${lila.rating}★ (${lila.reviewCount}), KC: ${kc.rating}★ (${kc.reviewCount})`);

        const pan = OntheGoCatalogue.getDestinationById("dest_pandhal");
        assert("Pandhal Cafe flagged with Edappally branch location notice (not in Fort Kochi)",
          pan && pan.holidayExceptions.includes("Edappally") && pan.rating === 4.7 && pan.reviewCount === 1700,
          `Notice: ${pan?.holidayExceptions}`);

        const pm = OntheGoCatalogue.getDestinationById("dest_printedmatter");
        assert("Printed Matter flagged with 5.0 Justdial non-comparable rating notice",
          pm && pm.reviewProvider.includes("Justdial") && pm.confidenceStatus === "partially_verified",
          `Provider: ${pm?.reviewProvider}`);


        // =========================================================
        // FINAL SUMMARY
        // =========================================================
        const passed = results.filter(r => r.passed).length;
        const total = results.length;
        const summaryEl = document.getElementById("summary");
        summaryEl.style.background = passed === total ? "#dcfce7" : "#fee2e2";
        summaryEl.style.color = passed === total ? "#15803d" : "#b91c1c";
        summaryEl.innerText = `[STAGE 7 SUITE RESULT] PASSED ${passed}/${total} tests (${(passed/total*100).toFixed(0)}%)`;

      } catch (err) {
        console.error("Fatal Test Suite Execution Error:", err);
        const errDiv = document.createElement("div");
        errDiv.className = "test-fail";
        errDiv.innerText = "Fatal Suite Execution Error: " + err.message + "\n" + err.stack;
        document.body.appendChild(errDiv);
      }
    });
  </script>
</body>
</html>
